<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#16005A"/></marker></defs><rect width="1400" height="900" fill="white"/><text x="70" y="72" font-family="Apple SD Gothic Neo, sans-serif" font-size="38" font-weight="700" fill="#16005A">포커스 영역과 프로젝트 경계</text><text x="70" y="112" font-family="Apple SD Gothic Neo, sans-serif" font-size="21" fill="#555">비즈니스 문서에서 결과물과 조직 프로세스 자산까지</text><rect x="50" y="310" width="170" height="120" rx="18" fill="#EFECF8" stroke="#6B48A8" stroke-width="3"/><text x="135.0" y="379.0" text-anchor="middle" font-family="Apple SD Gothic Neo, sans-serif" font-size="19" font-weight="700" fill="#16005A">스폰서</text><line x1="220" y1="370" x2="230" y2="370" stroke="#16005A" stroke-width="4" marker-end="url(#arrow)"/><rect x="230" y="310" width="170" height="120" rx="18" fill="#FAEDF6" stroke="#C54B9B" stroke-width="3"/><text x="315.0" y="379.0" text-anchor="middle" font-family="Apple SD Gothic Neo, sans-serif" font-size="19" font-weight="700" fill="#16005A">비즈니스 / 문서</text><line x1="400" y1="370" x2="430" y2="370" stroke="#16005A" stroke-width="4" marker-end="url(#arrow)"/><rect x="430" y="310" width="170" height="120" rx="18" fill="#EFECF8" stroke="#6B48A8" stroke-width="3"/><text x="515.0" y="379.0" text-anchor="middle" font-family="Apple SD Gothic Neo, sans-serif" font-size="19" font-weight="700" fill="#16005A">착수</text><line x1="600" y1="370" x2="610" y2="370" stroke="#16005A" stroke-width="4" marker-end="url(#arrow)"/><rect x="610" y="310" width="240" height="120" rx="18" fill="#EFECF8" stroke="#6B48A8" stroke-width="3"/><text x="730.0" y="379.0" text-anchor="middle" font-family="Apple SD Gothic Neo, sans-serif" font-size="19" font-weight="700" fill="#16005A">계획·실행 / 모니터링 및 통제</text><line x1="850" y1="370" x2="900" y2="370" stroke="#16005A" stroke-width="4" 