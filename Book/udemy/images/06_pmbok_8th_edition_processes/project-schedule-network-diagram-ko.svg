  <title id="title">프로젝트 일정 네트워크 다이어그램 한국어판</title>
  <desc id="desc">메리 컨설팅 신규 회사 웹사이트 프로젝트의 41개 활동을 주요 산출물별 스윔레인에 배치하고 종료-시작 의존 관계와 주공정을 표시한 네트워크 다이어그램</desc>
